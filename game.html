<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Impian Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#3b2a4a; --pink:#ff8fb8; --sky:#6ec6ff; --mint:#8fe3c0; --gold:#ffc83d; --purple:#a78bfa; --card:#fffaf3; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; font-family:'Fredoka',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:#bfe9ff; user-select:none; -webkit-user-select:none; }
  h1,h2,h3{ margin:.25em 0; }
  p{ margin:.4em 0; }
  .btn{ font:inherit; font-weight:600; border:0; border-radius:16px; padding:10px 18px; background:var(--pink); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.18); cursor:pointer; }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .btn.alt{ background:var(--sky); } .btn.gold{ background:var(--gold); color:#5a3b00; } .btn.ghost{ background:#fff; color:var(--ink); } .btn.mint{ background:var(--mint); color:#1d5a42; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; transform:none; }
  .screen{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:14px; background:linear-gradient(160deg,#bfe9ff,#ffe3f1 60%,#fff3c9); z-index:50; }
  .screen.show{ display:flex; }
  .box{ background:var(--card); border-radius:26px; padding:22px; max-width:600px; width:100%; box-shadow:0 8px 0 rgba(0,0,0,.12), 0 0 0 5px #fff inset; text-align:center; max-height:94vh; overflow:auto; }
  input[type=text]{ font:inherit; padding:10px 14px; border-radius:14px; border:3px solid #e6d6f5; width:100%; text-align:center; color:var(--ink); }
  body.embed .noembed{ display:none !important; }
  body.embed:not(.staff) .noembed-guest{ display:none !important; }   /* students never need it inside a dashboard; staff (email/password) can only play as a guest */
  .status{ min-height:1.3em; font-size:14px; margin-top:8px; color:#a63d2e; }
  .status.info{ color:#4b6156; }
  .starters{ display:flex; gap:10px; justify-content:center; margin:14px 0; flex-wrap:wrap; }
  .starter{ background:#fff; border:4px solid #eee; border-radius:18px; padding:8px; width:112px; cursor:pointer; }
  .starter.sel{ border-color:var(--pink); background:#fff0f6; }
  .starter img{ width:72px; height:98px; object-fit:contain; }
  .starter b{ display:block; font-size:15px; }
  .starter small{ color:#7a6a88; }

  /* ---- game screen ---- */
  #gameScreen{ position:fixed; inset:0; display:none; }
  #gameScreen.show{ display:block; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .hud{ position:absolute; z-index:5; }
  #partyBar{ left:10px; top:128px; display:flex; flex-direction:column; gap:6px; }
  .pm{ display:flex; align-items:center; gap:7px; background:#ffffffe6; border-radius:999px 16px 16px 999px; padding:3px 10px 3px 3px; box-shadow:0 3px 0 rgba(0,0,0,.12); border:3px solid transparent; min-width:136px; cursor:pointer; }
  .pm.act{ border-color:var(--pink); }
  .pm.down{ opacity:.45; filter:grayscale(1); }
  .pm img{ width:46px; height:46px; flex:none; border-radius:50%; background:#fff; border:3px solid var(--pink); object-fit:cover; box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .pm.act img{ width:50px; height:50px; }
  .pm .nm{ font-size:12px; font-weight:600; line-height:1.1; }
  .pm .hpb{ height:7px; width:80px; background:#e8dff2; border-radius:6px; overflow:hidden; margin-top:3px; }
  .pm .hpb i{ display:block; height:100%; background:linear-gradient(90deg,#6ee7a8,#2fbf71); }
  .pm .k{ font-size:10px; color:#8a7a98; margin-left:auto; padding-left:4px; }
  #zoneLabel{ left:50%; top:10px; transform:translateX(-50%); background:#ffffffe6; border-radius:18px; padding:6px 16px; font-weight:600; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:opacity .6s; white-space:nowrap; }
  #topRight{ right:10px; top:10px; display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap; max-width:55vw; }
  .chip{ background:#ffffffe6; border-radius:14px; padding:6px 12px; font-weight:600; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .ibtn{ font-size:20px; padding:6px 12px; border-radius:14px; }
  #stick{ left:18px; bottom:18px; width:132px; height:132px; border-radius:50%; background:#ffffff66; border:3px solid #ffffffaa; display:none; touch-action:none; }
  #knob{ position:absolute; left:41px; top:41px; width:50px; height:50px; border-radius:50%; background:#ffffffcc; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  #acts{ right:18px; bottom:18px; display:none; gap:12px; align-items:flex-end; }
  .round{ width:70px; height:70px; border-radius:50%; font-size:26px; padding:0; position:relative; }
  .round small{ position:absolute; bottom:4px; left:0; right:0; font-size:12px; }
  body.touch #stick{ display:block; } body.touch #acts{ display:flex; }
  #helpHint{ left:50%; bottom:12px; transform:translateX(-50%); background:#ffffffcc; border-radius:14px; padding:6px 14px; font-size:13px; text-align:center; transition:opacity 1s; }
  body.touch #helpHint{ display:none; }
  #toast{ position:absolute; left:50%; top:70px; transform:translateX(-50%); background:#3b2a4aee; color:#fff; padding:9px 18px; border-radius:18px; z-index:30; font-weight:500; opacity:0; transition:opacity .35s; pointer-events:none; max-width:86vw; text-align:center; }
  #toast.show{ opacity:1; }

  /* ---- minimap (top-left) ---- */
  #miniMap{ left:10px; top:10px; width:150px; height:105px; border-radius:18px; border:3px solid #fff; box-shadow:0 4px 0 rgba(0,0,0,.18); overflow:hidden; cursor:pointer; background:#7fd3ff; padding:0; }
  #miniMap canvas{ width:100%; height:100%; display:block; }
  #miniMap .mmLabel{ position:absolute; left:6px; bottom:4px; font-size:11px; font-weight:600; background:#ffffffd9; border-radius:8px; padding:1px 7px; pointer-events:none; color:var(--ink); }
  @media (max-width:640px){ #miniMap{ width:112px; height:78px; } #partyBar{ top:100px; } }
  /* ---- world map panel ---- */
  #mapWrap{ position:relative; width:100%; max-width:680px; margin:8px auto; }
  #mapWrap canvas{ width:100%; display:block; border-radius:16px; border:4px solid #fff; box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .rl{ position:absolute; transform:translate(-50%,-50%); font-weight:700; font-size:13px; color:#fff; text-shadow:0 1px 3px #000b; pointer-events:none; white-space:nowrap; }
  .wp{ position:absolute; transform:translate(-50%,-50%); width:32px; height:32px; border-radius:50%; border:3px solid #fff; background:var(--gold); box-shadow:0 3px 0 rgba(0,0,0,.3); font-size:15px; line-height:1; padding:0; cursor:pointer; color:#5a3b00; }
  .wp.sel{ outline:4px solid var(--pink); }
  .wp.lock{ background:#b9b2c4; color:#fff; }
  .you{ position:absolute; transform:translate(-50%,-100%); font-size:22px; pointer-events:none; filter:drop-shadow(0 2px 0 #0006); }
  /* ---- reviving / teleporting ---- */
  #wipeOv{ position:fixed; inset:0; background:#2a1a3acc; display:none; align-items:center; justify-content:center; z-index:35; color:#fff; text-align:center; font-weight:600; font-size:17px; line-height:1.5; }
  #wipeOv.show{ display:flex; } #wipeOv big{ display:block; font-size:28px; margin:6px 0 4px; }
  #fadeOv{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; z-index:36; } #fadeOv.on{ opacity:1; }

  /* ---- panels ---- */
  #panel{ position:fixed; inset:0; background:#2a1a3a88; display:none; align-items:center; justify-content:center; padding:12px; z-index:40; }
  #panel.show{ display:flex; }
  #sheet{ position:relative; background:var(--card); border-radius:26px; padding:20px 18px 18px; width:100%; max-width:720px; max-height:92vh; overflow:auto; box-shadow:0 8px 0 rgba(0,0,0,.15), 0 0 0 5px #fff inset; }
  #pClose{ position:absolute; right:12px; top:10px; width:36px; height:36px; border-radius:50%; border:0; background:#eadff5; font-size:16px; cursor:pointer; color:var(--ink); }
  .tabs{ display:flex; gap:8px; justify-content:center; margin:6px 0 12px; flex-wrap:wrap; }
  .tab{ font:inherit; font-weight:600; border:0; padding:7px 16px; border-radius:14px; background:#eadff5; color:var(--ink); cursor:pointer; }
  .tab.on{ background:var(--pink); color:#fff; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; }
  .card{ background:#fff; border:4px solid #eee; border-radius:18px; padding:8px 6px; text-align:center; position:relative; cursor:pointer; }
  .card.r5{ border-color:#ffc83d; background:linear-gradient(#fff8e0,#fff); } .card.r4{ border-color:#c3a6ff; background:linear-gradient(#f4eeff,#fff); } .card.r3{ border-color:#9fd6ff; }
  .card.in{ box-shadow:0 0 0 3px var(--pink); }
  .card img{ width:64px; height:88px; object-fit:contain; }
  .card.w img{ width:64px; height:64px; }
  .card b{ display:block; font-size:13px; line-height:1.15; min-height:30px; }
  .card .st{ font-size:12px; color:#e0a400; letter-spacing:1px; } .card.r4 .st{ color:#8b5cf6; } .card.r3 .st{ color:#3b9be0; }
  .card .badge{ position:absolute; top:4px; right:6px; font-size:11px; background:var(--pink); color:#fff; padding:1px 7px; border-radius:10px; }
  .card.locked img{ filter:brightness(0) opacity(.28); }
  .card.locked{ cursor:default; }
  .detail{ background:#fff; border-radius:16px; padding:10px 14px; margin-top:10px; min-height:60px; font-size:14px; text-align:left; }
  .q-subject{ display:inline-block; background:#e3f4ff; color:#1b6fa8; border-radius:12px; padding:3px 12px; font-size:13px; font-weight:600; }
  .q-prompt{ font-size:20px; font-weight:600; margin:14px 4px; white-space:pre-wrap; text-align:left; }
  .opts{ display:grid; gap:10px; }
  .opt{ font:inherit; font-size:17px; text-align:left; border:3px solid #eadff5; background:#fff; border-radius:16px; padding:11px 14px; cursor:pointer; color:var(--ink); }
  .opt:hover{ border-color:var(--pink); }
  .opt.good{ background:#d7f7e5; border-color:#46c47e; } .opt.bad{ background:#ffe0dc; border-color:#e5604f; }
  .note{ font-size:14px; color:#6c5a7d; }
  .bannerCard{ background:linear-gradient(135deg,#ffe9a8,#ffd3ea,#cfe9ff); border-radius:22px; padding:14px; display:flex; align-items:center; gap:14px; text-align:left; }
  .bannerCard img{ width:110px; height:150px; object-fit:contain; filter:drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
  .pbar{ height:12px; background:#fff; border-radius:8px; overflow:hidden; margin:6px 0; } .pbar i{ display:block; height:100%; background:linear-gradient(90deg,#ffd84a,#ff9f1c); }
  .hist{ max-height:200px; overflow:auto; font-size:13px; text-align:left; background:#fff; border-radius:14px; padding:8px 12px; margin-top:10px; }
  .hist .r5{ color:#d99a00; font-weight:700; } .hist .r4{ color:#8b5cf6; font-weight:600; } .hist .r3{ color:#4a90c8; }

  /* ---- wish animation ---- */
  #wishOv{ position:fixed; inset:0; background:radial-gradient(circle at 50% 40%,#2f2a66,#0f0c2a); z-index:60; display:none; overflow:hidden; }
  #wishOv.show{ display:block; }
  #wishOv .skip{ position:absolute; right:16px; top:14px; z-index:3; }
  .meteor{ position:absolute; left:50%; top:50%; width:16px; height:16px; border-radius:50%; animation:fall 1.7s ease-in forwards; }
  .meteor::after{ content:""; position:absolute; right:6px; bottom:6px; width:260px; height:6px; transform-origin:right center; transform:rotate(-35deg); border-radius:6px; }
  .r3 .meteor{ background:#8fd0ff; box-shadow:0 0 30px 14px #5aa9f0; } .r3 .meteor::after{ background:linear-gradient(90deg,transparent,#8fd0ff); }
  .r4 .meteor{ background:#d6b8ff; box-shadow:0 0 30px 14px #a77bf5; } .r4 .meteor::after{ background:linear-gradient(90deg,transparent,#d6b8ff); }
  .r5 .meteor{ background:#ffe58a; box-shadow:0 0 40px 20px #ffb300; } .r5 .meteor::after{ background:linear-gradient(90deg,transparent,#ffe58a); }
  @keyframes fall{ 0%{ transform:translate(-70vw,-70vh) scale(.4); opacity:0; } 15%{ opacity:1; } 85%{ transform:translate(0,0) scale(1); opacity:1; } 100%{ transform:translate(0,0) scale(7); opacity:0; } }
  .wres{ position:absolute; inset:0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; padding:60px 14px 90px; overflow:auto; }
  .wcard{ width:112px; background:#fffaf3; border-radius:18px; padding:8px 4px; text-align:center; border:4px solid #9fd6ff; animation:pop .5s both; }
  .wcard.r4{ border-color:#b894ff; } .wcard.r5{ border-color:#ffc83d; box-shadow:0 0 24px 6px #ffc83d99; }
  .wcard img{ width:72px; height:98px; object-fit:contain; } .wcard.w img{ height:72px; }
  .wcard b{ display:block; font-size:12px; min-height:28px; line-height:1.1; } .wcard .st{ color:#e0a400; font-size:12px; } .wcard .tag{ font-size:11px; color:#e0457b; font-weight:700; }
  .wclose{ position:absolute; left:50%; bottom:22px; transform:translateX(-50%); }
  @keyframes pop{ from{ transform:scale(.2) rotate(-8deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }
  @media (max-width:640px){ #topRight{ max-width:48vw; } .chip{ padding:4px 8px; font-size:13px; } #zoneLabel{ top:62px; font-size:13px; } }
</style>
</head>
<body>

<!-- ============ screens ============ -->
<div class="screen show" id="loginScreen">
  <div class="box">
    <div id="loginArt" style="display:flex;justify-content:center;gap:2px;margin-bottom:6px;"></div>
    <h1>Impian Quest</h1>
    <p class="note">Explore Malaysia, meet cute friends and make a wish &mdash; every correct answer earns a wish!</p>
    <div style="display:grid;gap:10px;margin-top:14px;">
      <button class="btn" id="btnGoogle">Sign in with Google (use my class questions)</button>
      <button class="btn ghost noembed-guest" id="btnGuest">Play as guest (saved on this device only)</button>
      <a class="noembed" href="report.html" style="color:#7a6a88;font-size:14px;">&larr; Back to my results</a>
    </div>
    <div class="status" id="loginStatus"></div>
  </div>
</div>

<div class="screen" id="nameScreen">
  <div class="box">
    <h2>Welcome, traveller!</h2>
    <p class="note">What should we call you?</p>
    <input type="text" id="nameInput" maxlength="16" placeholder="Your adventurer name">
    <p class="note" style="margin-top:14px;">Pick your free starter friend:</p>
    <div class="starters" id="starters"></div>
    <button class="btn gold" id="btnStart" disabled>Start adventure!</button>
    <div class="status" id="nameStatus"></div>
  </div>
</div>

<div id="gameScreen">
  <canvas id="cv"></canvas>
  <button class="hud" id="miniMap" type="button" aria-label="Open the world map (M)" title="World map (M)"><canvas id="miniCv" width="150" height="105"></canvas><span class="mmLabel">&#128506;&#65039; Map</span></button>
  <div class="hud" id="partyBar"></div>
  <div class="hud" id="zoneLabel"></div>
  <div class="hud" id="topRight">
    <span class="chip" id="chipWish">&#11088; 0</span>
    <span class="chip" id="chipAR">AR 1</span>
    <button class="btn ibtn" id="bStudy" title="Study Station">&#128214;</button>
    <button class="btn ibtn gold" id="bWish" title="Wish">&#127776;</button>
    <button class="btn ibtn alt" id="bBag" title="Backpack">&#127890;</button>
    <button class="btn ibtn ghost" id="bSet" title="Settings">&#9881;&#65039;</button>
  </div>
  <div class="hud" id="stick"><i id="knob"></i></div>
  <div class="hud" id="acts">
    <button class="btn round alt" id="bSkill">&#10024;<small id="skcd"></small></button>
    <button class="btn round" id="bAtk">&#9876;&#65039;</button>
  </div>
  <div class="hud" id="helpHint">WASD / arrows: move &middot; Space: attack &middot; E: skill &middot; 1-4: switch friend &middot; M: map</div>
  <div id="toast"></div>
</div>

<div id="panel"><div id="sheet"></div></div>
<div id="wishOv"></div>
<div id="wipeOv"><div id="wipeMsg"></div></div>
<div id="fadeOv"></div>

<!-- Firebase SDK bridge (same pattern as mentoring.html) -->
<script type="module">

  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  window.dispatchEvent(new Event("firebase-sdk-ready"));
</script>

function weekIdx(){ return Math.floor(Date.now()/6048e5); }
function featuredFor(bk,sub){ return bk==='char' ? RELEASE.banners[(sub|0)%RELEASE.banners.length].five : WP[5][weekIdx()%WP[5].length]; }
function rate5(b,n){ if(n>=b.hard) return 1; if(n>=b.soft) return Math.min(1, b.base5+(n-b.soft+1)*b.step5); return b.base5; }
function rollOne(S,bk,feat5){
  var b=BANNER[bk], P=S.pity[bk];
  P.n5++; P.n4++;
  var rar=3;
  if(rnd()<rate5(b,P.n5)) rar=5;
  else { var q = P.n4>=10 ? 1 : (b.p4[P.n4-1]!=null ? b.p4[P.n4-1] : b.base4); if(rnd()<q) rar=4; }
  var id, kind=b.kind, feat=false;
  if(rar===5){
    P.n5=0; P.n4=0;
    var f=feat5||featuredFor(bk,0);
    if(P.g || rnd()<b.featP){ id=f; P.g=false; feat=true; }
    else {
      var others=(kind==='char'?FIVE_CHARS:WP[5]).filter(function(x){ return x!==f; });
      if(others.length){ id=pick(others); P.g=true; } else { id=f; P.g=false; feat=true; }   // nobody else exists yet: can't lose the 50/50
    }
  } else if(rar===4){
    P.n4=0; id=pick(kind==='char'?FOUR_CHARS:WP[4]);
  } else { kind='weap'; id=pick(WP[3]); }
  return { kind:kind, id:id, rar:rar, feat:feat };
}
function applyPull(S,r){
  if(r.kind==='char'){
    var o=S.chars[r.id];
    if(o){ if(o.c<6) o.c++; r.tag='C'+o.c; r.dupe=true; } else { S.chars[r.id]={c:0}; r.tag='NEW'; }
  } else {
    var w=S.weapons[r.id];
    if(w){ if(w.r<5) w.r++; r.tag='R'+w.r; r.dupe=true; } else { S.weapons[r.id]={r:1}; r.tag='NEW'; }
  }
  return r;
}
function doWish(S,bk,n,feat5){
  var out=[];
  for(var i=0;i<n;i++){
    if(S.wishes<1) break;
    S.wishes--; S.totalPulls=(S.totalPulls||0)+1;
    var r=applyPull(S, rollOne(S,bk,feat5)); out.push(r);
    S.hist.unshift({ t:Date.now(), k:r.kind, id:r.id, rar:r.rar, b:bk });
  }
  if(S.hist.length>100) S.hist.length=100;
  return out;
}

function sanitize(s){
  if(!s||typeof s!=='object') return null;
  var d=newSave(s.name||'Traveller','bao');
  Object.keys(d).forEach(function(k){ if(s[k]!==undefined) d[k]=s[k]; });
  Object.keys(d.chars).forEach(function(id){ if(!CHARS[id]) delete d.chars[id]; });

var SUBJECT_Q = [];
var DAILY_CAP = 10;

// Which semester's subjects apply: the lecturer's "Current semester" if set; otherwise the student's most recently published one.
function pickSemester(en,wanted){
  if(wanted) return en[wanted] ? wanted : null;
  var best=null, bt=-1;
  Object.keys(en||{}).forEach(function(k){ Object.keys(en[k]||{}).forEach(function(id){ var e=en[k][id]; if(!e||!e.active) return; var t=toMs(e.publishedAt); if(t>=bt){ bt=t; best=k; } }); });

}
// Questions come ONLY from subjects this student is enrolled in for the chosen semester:
//   gameEnrollments/<email>  ->  which subjects (and semester) they take
//   gameQuestionBanks/<id>   ->  that subject's questions (ignored if it was republished for a different semester)
function loadSubjectQuestions(){
  SUBJECT_Q=[]; SCOPE={ semester:'', subjects:[] };
  if(APP.mode!=='cloud'||!db) return Promise.resolve();
  var sdk=window.firebaseSDK, email=String(APP.email||'').toLowerCase();
  return Promise.all([
    sdk.getDoc(sdk.doc(db,'adminSettings','dashboard')).catch(function(){ return null; }),
    sdk.getDoc(sdk.doc(db,'gameEnrollments',email)).catch(function(){ return null; })
  ]).then(function(r){
    var settings=(r[0]&&r[0].exists&&r[0].exists())?(r[0].data()||{}):{};
    var en=(r[1]&&r[1].exists&&r[1].exists())?((r[1].data()||{}).enrollments||{}):{};
    var semKey=pickSemester(en,settings.currentSemesterKey);
    if(!semKey) return;
    var entries=en[semKey]||{}, ids=Object.keys(entries).filter(function(id){ return entries[id]&&entries[id].active; });
    return Promise.all(ids.map(function(id){
      return sdk.getDoc(sdk.doc(db,'gameQuestionBanks',id)).then(function(snap){ return (snap&&snap.exists&&snap.exists())?snap.data():null; }).catch(function(){ return null; });
    })).then(function(banks){
      banks.forEach(function(b){
        if(!b||b.semesterKey!==semKey) return;
        var n=0;
        (b.questions||[]).forEach(function(q){
          if(!q||!q.prompt||!q.options||q.options.length<2||typeof q.correctIndex!=='number') return;
          SUBJECT_Q.push({ key:b.subjectId+'|'+(q.id||q.prompt.slice(0,40)), sid:b.subjectId, subject:b.subjectName||'Your subject', prompt:q.prompt, options:q.options.slice(0,4), correct:q.correctIndex, explain:q.explanation||'' }); n++;
        });
        SCOPE.subjects.push({ id:b.subjectId, name:b.subjectName||'Your subject', total:n }); SCOPE.semester=b.semester||SCOPE.semester;
      });
    });
  }).catch(function(){ /* no enrolment yet - fine */ });
}
function availableSubjectQs(){
  var now=Date.now();
  return SUBJECT_Q.filter(function(q){ return !S.solved[q.key] && !(S.locked[q.key]>now); });
}
function genMath(){
  var t=rint(0,5), prompt, ans, a, b, x, m, c, p, n;
  switch(t){
    case 0: a=rint(12,89); b=rint(12,89); prompt=a+' + '+b+' = ?'; ans=a+b; break;
    case 1: a=rint(60,160); b=rint(11,59); prompt=a+' \u2212 '+b+' = ?'; ans=a-b; break;
    case 2: a=rint(6,15); b=rint(6,15); prompt=a+' \u00d7 '+b+' = ?'; ans=a*b; break;
    case 3: x=rint(2,12); m=rint(2,9); c=rint(1,20); prompt='Solve for x:  '+m+'x + '+c+' = '+(m*x+c); ans=x; break;
    case 4: p=pick([10,20,25,50]); n=pick([40,60,80,120,200]); prompt='What is '+p+'% of '+n+'?'; ans=n*p/100; break;
    default: a=rint(2,9); x=rint(1,8); prompt="If f(x) = "+a+"x\u00b2, what is f\u2032("+x+")?"; ans=2*a*x;
  }
  var set={}; set[ans]=1; var wrong=[]; var tries=0;
  while(wrong.length<3 && tries++<60){
    var d=pick([-10,-5,-3,-2,-1,1,2,3,5,10,Math.max(2,Math.round(ans*0.2))]);
    var v=ans+d; if(v<0||set[v]) continue; set[v]=1; wrong.push(v);
  }
  var k=4; while(wrong.length<3){ var v2=ans+(k++); if(!set[v2]){ set[v2]=1; wrong.push(v2); } }
  var opts=shuffle([ans].concat(wrong));
  return { key:null, subject:'General Maths', prompt:prompt, options:opts.map(String), correct:opts.indexOf(ans), explain:'', general:true };
}

  var pool=availableSubjectQs();
  if(pool.length) return pick(pool);

  return null;
}

  var m=new Uint8Array(MW*MH);

  function get(x,y){ return (x<0||y<0||x>=MW||y>=MH)?T.ROCK:m[y*MW+x]; }
  var x,y;
  for(y=0;y<MH;y++) for(x=0;x<MW;x++) m[y*MW+x] = zoneOf(x,y)===3 ? T.FOREST : T.GRASS;
  // sea + sand (Penang)
  for(y=0;y<28;y++){ for(x=63;x<66;x++) set(x,y,T.SAND); for(x=66;x<MW;x++) set(x,y,T.WATER); }
  // river (Borneo)
  for(y=28;y<MH;y++){ set(68,y,T.WATER); set(69,y,T.WATER); }
  // roads (2 wide) linking all four zones
  var rx, ry;
  for(x=0;x<=62;x++){ set(x,14,T.ROAD); set(x,15,T.ROAD); }
  for(y=0;y<MH;y++){ set(20,y,T.ROAD); set(21,y,T.ROAD); set(60,y,T.ROAD); set(61,y,T.ROAD); }
  for(x=0;x<MW;x++){ set(x,42,T.ROAD); set(x,43,T.ROAD); }
  set(68,42,T.BRIDGE); set(69,42,T.BRIDGE); set(68,43,T.BRIDGE); set(69,43,T.BRIDGE);

  // KL: plaza, twin towers, building blocks, parks
  for(y=8;y<=12;y++) for(x=22;x<=35;x++) set(x,y,T.PLAZA);
  [[27,5],[31,5]].forEach(function(p){ for(var j=0;j<3;j++) for(var i=0;i<2;i++) set(p[0]+i,p[1]+j,T.BUILD); });
  for(var by=1;by<27;by+=5) for(var bx=1;bx<39;bx+=5){
    var w=2+Math.floor(hash(bx+3,by+5)*2), h=2+Math.floor(hash(bx+9,by+1)*2), ok=hash(bx,by)<0.6; // deterministic: same town every visit
    if(!ok) continue;
    var clear=true;

    if(!clear) continue;
    for(var j2=0;j2<h;j2++) for(var i2=0;i2<w;i2++) set(bx+i2,by+j2,T.BUILD);
  }
  // Penang: Penang Hill, hawker plaza with stalls
  for(y=2;y<=6;y++) for(x=47;x<=54;x++) if(hash(x,y)<0.85) set(x,y,T.ROCK);
  for(y=18;y<=23;y++) for(x=44;x<=52;x++){ set(x,y,T.PLAZA); if((x+y)%4===0 && y%2===0) set(x,y,T.BUILD); }
  // Cameron: tea terraces

}

  var wp=nearestWaypoint(G.p.x,G.p.y); G.wipe={ t:WIPE_SEC, wp:wp.id };
  $('wipeMsg').innerHTML='\uD83D\uDCA4<big>Everyone is sleepy\u2026</big>Waking up at <b>'+esc(wp.name)+'</b>';
  $('wipeOv').className='show';
}
function finishWipe(){
  var wp=WPS.filter(function(w){ return w.id===G.wipe.wp; })[0]||nearestWaypoint(G.p.x,G.p.y);
  S.party.forEach(function(id){ reviveMember(id,WIPE_HP,true); });
  G.active=0; G.wipe=null; $('wipeOv').className='';
  moveTo(wp.x,wp.y); toast('Everyone woke up at '+wp.name+'. Your progress is kept \u2014 monsters stay as you left them.'); updateHUD(true);
}

function newGame(){
  if(!map){ map=genMap(); reach=computeReach(); }
  if(!WPS.length) buildWaypoints();
  var px=S.pos?S.pos.x:(SPAWN.x+0.5)*TS, py=S.pos?S.pos.y:(SPAWN.y+0.5)*TS;
  if(!canStand(px,py,11)){ px=(SPAWN.x+0.5)*TS; py=(SPAWN.y+0.5)*TS; }
  G={ p:{x:px,y:py,fx:1,fy:0,atkCD:0,skCD:0,inv:0,bob:0,moving:false,flip:1,swapCD:0}, active:0, hp:{}, down:{}, wipe:null, mons:[], pickups:[], fx:[], cam:{x:0,y:0}, zone:-1, calm:0, t:0 };
  S.party.forEach(function(id){ G.hp[id]=charStats(id).hp; });
  if(!S.wp) S.wp={};
  WPS.forEach(function(w){ if(MAPCFG.openAllWaypoints||w.id==='kl') S.wp[w.id]=true; });
  spawnMonsters();
  updateHUD(true);
}
function spawnMonsters(){
  G.mons=[];
  var plan=[ [0,[['kuih',9],['nyamuk',5]],[1,2]], [1,[['rambutan',6],['hantu',6],['nyamuk',3]],[3,4]], [2,[['tenggiling',7],['durian',6],['hantu',3]],[5,6]], [3,[['rafflesia',7],['durian',5],['tenggiling',4]],[7,8]] ];
  plan.forEach(function(zp){
    var z=zp[0], tries=0;
    zp[1].forEach(function(e){
      for(var n=0;n<e[1];n++){
        var tx,ty,ok=false;
        while(!ok && tries++<4000){
          tx=rint(0,MW-1); ty=rint(0,MH-1);
          ok = zoneOf(tx,ty)===z && reach[ty*MW+tx] && !(Math.abs(tx-SPAWN.x)<8&&Math.abs(ty-SPAWN.y)<8) && map[ty*MW+tx]!==T.ROAD;
        }
        if(ok) addMon(e[0],tx,ty,rint(zp[2][0],zp[2][1]));
      }
    });
  });
  addMon('rajadurian',73,37,10);
}
function addMon(type,tx,ty,lvl){
  var d=MON[type], hpm=Math.round(d.hp*(0.8+0.25*lvl)), x=(tx+0.5)*TS, y=(ty+0.5)*TS;
  G.mons.push({ type:type, lvl:lvl, x:x, y:y, hx:x, hy:y, hp:hpm, max:hpm, atk:Math.round(d.atk*(0.8+0.15*lvl)), cd:0, dead:0, wt:0, tx:x, ty:y, hurt:0 });
}
function toast(msg){ var t=$('toast'); t.textContent=msg; t.className='show'; clearTimeout(toast.h); toast.h=setTimeout(function(){ t.className=''; },2600); }
function addFx(o){ G.fx.push(o); }
function dmgText(x,y,txt,col){ addFx({ k:'txt', x:x, y:y, txt:txt, col:col||'#fff', t:0, life:0.8 }); }

function doAttack(){
  if(!G||panelOpen||G.wipe||G.p.atkCD>0) return;
  var p=G.p, st=charStats(activeId()); p.atkCD=0.38;
  addFx({ k:'slash', x:p.x, y:p.y, fx:p.fx, fy:p.fy, t:0, life:0.18 });
  G.mons.forEach(function(m){
    if(m.dead) return;
    var dx=m.x-p.x, dy=m.y-p.y, d=Math.hypot(dx,dy), reachR=70+MON[m.type].size*0.25;
    if(d<reachR && (d<20 || (dx*p.fx+dy*p.fy)/d>0.15)) hitMon(m, st.atk*(0.9+rnd()*0.2), '#fff', dx/(d||1), dy/(d||1));
  });
}
function doSkill(){
  if(!G||panelOpen||G.wipe||G.p.skCD>0) return;
  var p=G.p, id=activeId(), c=CHARS[id], st=charStats(id); p.skCD=6;
  addFx({ k:'ring', x:p.x, y:p.y, col:ELEM[c.el].color, t:0, life:0.55 });
  toast(c.name+': '+c.skill+'!');
  G.mons.forEach(function(m){
    if(m.dead) return;
    var dx=m.x-p.x, dy=m.y-p.y, d=Math.hypot(dx,dy);
    if(d<130){
      var weak=MON[m.type].weak===c.el;
      hitMon(m, st.atk*2.3*(1+st.bonus)*(weak?1.5:1), weak?'#ffb703':ELEM[c.el].color, dx/(d||1), dy/(d||1), weak);
    }
  });
}
function hitMon(m,dmg,col,nx,ny,weak){
  var crit=rnd()<0.1; if(crit) dmg*=1.5; dmg=Math.max(1,Math.round(dmg));
  m.hp-=dmg; m.hurt=0.2; m.x+=nx*10; m.y+=ny*10; if(blocked(m.x,m.y)){ m.x-=nx*10; m.y-=ny*10; }
  dmgText(m.x,m.y-30,(crit?'\u2605':'')+dmg+(weak?'!':''),crit?'#ffd34d':col);
  if(m.hp<=0) killMon(m);
}
function killMon(m){
  m.dead=m.type==='rajadurian'?60:22; S.kills++;
  var d=MON[m.type];
  addFx({ k:'pop', x:m.x, y:m.y, t:0, life:0.5 });
  gainXP(Math.round(d.xp*(0.8+0.2*m.lvl)));
  if(rnd()<(d.boss?1:0.28)) G.pickups.push({ x:m.x, y:m.y, t:0 });
  markDirty();
}
function gainXP(n){
  S.xp+=n; var need=30+20*S.ar;
  while(S.xp>=need){ S.xp-=need; S.ar++; need=30+20*S.ar; toast('Adventure Rank '+S.ar+'! Your friends feel stronger.'); S.party.forEach(function(id){ G.hp[id]=charStats(id).hp; }); }
  updateHUD(true);
}
function hurtPlayer(dmg){
  var p=G.p; if(p.inv>0||G.wipe) return;
  var id=activeId(); G.hp[id]=Math.max(0,G.hp[id]-dmg); p.inv=0.7; G.calm=0;
  dmgText(p.x,p.y-34,'-'+dmg,'#ff6b6b');
  if(G.hp[id]<=0){
    G.down[id]=REVIVE_SOLO_SEC;     // they nap, then wake up on their own
    var next=-1; for(var i=0;i<S.party.length;i++) if(G.hp[S.party[i]]>0){ next=i; break; }
    if(next>=0){ G.active=next; toast(CHARS[id].name+' dozed off and wakes in '+REVIVE_SOLO_SEC+'s. '+CHARS[S.party[next]].name+' steps in.'); }
    else startWipe();               // whole team asleep: everyone wakes at the nearest waypoint - no restart, nothing is lost
  }
  updateHUD(true);
}
function switchTo(i){
  if(!G||panelOpen||G.wipe||i>=S.party.length||i===G.active||G.p.swapCD>0) return;
  if(G.hp[S.party[i]]<=0){ toast(CHARS[S.party[i]].name+' is resting \u2014 wakes in '+Math.ceil(G.down[S.party[i]]||0)+'s.'); return; }
  G.active=i; G.p.swapCD=0.5; updateHUD(true);
}
function stepMove(ent,dx,dy,r){ if(canStand(ent.x+dx,ent.y,r)) ent.x+=dx; if(canStand(ent.x,ent.y+dy,r)) ent.y+=dy; }

function update(dt){
  if(!G||panelOpen) return;
  var p=G.p; G.t+=dt;
  // revive timers: a friend who dozed off wakes by themselves - nobody is ever stuck
  var woke=false;
  Object.keys(G.down).forEach(function(id){
    if(G.hp[id]>0){ delete G.down[id]; return; }
    G.down[id]-=dt;
    if(G.down[id]<=0 && !G.wipe){ reviveMember(id,REVIVE_SOLO_HP,false); woke=true; }
  });
  if(woke) updateHUD(true);
  if(G.wipe){                       // short "everyone is sleepy" moment, then back up at a waypoint
    G.wipe.t-=dt; G.fx=G.fx.filter(function(f){ f.t+=dt; return f.t<f.life; });
    if(G.wipe.t<=0) finishWipe();
    return;
  }
  var ix=(keys.right?1:0)-(keys.left?1:0)+touch.dx, iy=(keys.down?1:0)-(keys.up?1:0)+touch.dy;
  var mag=Math.hypot(ix,iy);
  p.moving=mag>0.12;
  if(p.moving){ ix/=Math.max(1,mag); iy/=Math.max(1,mag); stepMove(p,ix*155*dt,iy*155*dt,11); var l=Math.hypot(ix,iy)||1; p.fx=ix/l; p.fy=iy/l; if(Math.abs(ix)>0.2) p.flip=ix<0?-1:1; p.bob+=dt*12; }
  p.atkCD=Math.max(0,p.atkCD-dt); p.skCD=Math.max(0,p.skCD-dt); p.inv=Math.max(0,p.inv-dt); p.swapCD=Math.max(0,p.swapCD-dt);
  if(keys.atk) doAttack();
  // monsters
  G.mons.forEach(function(m){
    var d=MON[m.type];
    if(m.dead>0){ m.dead-=dt; if(m.dead<=0){ m.dead=0; m.hp=m.max; m.x=m.hx; m.y=m.hy; } return; }
    m.hurt=Math.max(0,m.hurt-dt); m.cd=Math.max(0,m.cd-dt);
    var dx=p.x-m.x, dy=p.y-m.y, dist=Math.hypot(dx,dy), aggro=d.boss?260:175;
    var hd=Math.hypot(m.hx-m.x,m.hy-m.y);
    if(dist<aggro && hd<(d.boss?520:420)){
      var sp=d.spd*dt; stepMove(m,dx/dist*sp,dy/dist*sp,10);
    } else if(hd>30 && dist>=aggro){
      var sp2=d.spd*0.8*dt; stepMove(m,(m.hx-m.x)/hd*sp2,(m.hy-m.y)/hd*sp2,10);
    } else {
      m.wt-=dt; if(m.wt<=0){ m.wt=rnd()*2+1; m.tx=m.hx+(rnd()-0.5)*110; m.ty=m.hy+(rnd()-0.5)*110; }
      var wx=m.tx-m.x, wy=m.ty-m.y, wd=Math.hypot(wx,wy);
      if(wd>6) stepMove(m,wx/wd*d.spd*0.35*dt,wy/wd*d.spd*0.35*dt,10);
    }
    var touchR=(d.boss?58:32);
    if(dist<touchR && m.cd<=0){ m.cd=d.boss?1.2:1.0; hurtPlayer(m.atk); }
  });
  // pickups
  G.pickups=G.pickups.filter(function(k){
    k.t+=dt;
    if(Math.hypot(k.x-p.x,k.y-p.y)<28){
      var id=activeId(), mx=charStats(id).hp; G.hp[id]=Math.min(mx,G.hp[id]+Math.round(mx*0.35));
      dmgText(p.x,p.y-40,'Nasi Lemak! +HP','#6ee7a8'); updateHUD(true); return false;
    }
    return k.t<40;
  });
  // fx
  G.fx=G.fx.filter(function(f){ f.t+=dt; return f.t<f.life; });
  // slow regen when calm
  G.calm+=dt;
  if(G.calm>5){ S.party.forEach(function(id){ var mx=charStats(id).hp; if(G.hp[id]>0&&G.hp[id]<mx) G.hp[id]=Math.min(mx,G.hp[id]+mx*0.02*dt); }); }
  // waypoints that aren't open yet unlock when you walk close to them
  if(!MAPCFG.openAllWaypoints && Math.floor(G.t*2)!==Math.floor((G.t-dt)*2)) unlockNearbyWaypoints();
  // zone
  var z=zoneOf(Math.floor(p.x/TS),Math.floor(p.y/TS));
  if(z!==G.zone){ G.zone=z; var zl=$('zoneLabel'); zl.textContent='\uD83D\uDCCD '+ZONES[z]; zl.style.opacity=1; clearTimeout(update.zh); update.zh=setTimeout(function(){ zl.style.opacity=0.55; },2500); }
  hudT+=dt; if(hudT>0.12){ hudT=0; updateHUD(false); }
}

// ---------------- rendering ----------------
var COL={ grass:['#9ee493','#94dc89','#a6e89b'], forest:['#5fb86a','#58ad63','#66c071'], sand:'#f6e2a8', water:['#6ec6ff','#7ccdff'], road:'#c9c4d4', plaza:['#f1e6d3','#e8dcc6'], tea:['#7fcf6a','#5fb552'], flower:'#9ee493' };
function drawGround(x0,y0,x1,y1,camx,camy,time){
  for(var ty=y0;ty<=y1;ty++) for(var tx=x0;tx<=x1;tx++){
    var t=map[ty*MW+tx], h=hash(tx,ty), sx=tx*TS-camx, sy=ty*TS-camy, c;
    switch(t){
      case T.WATER: c=COL.water[(Math.floor(time*1.2+tx+ty))%2]; break;
      case T.SAND: c=COL.sand; break;
      case T.ROAD: c=COL.road; break;
      case T.BRIDGE: c='#c58b5c'; break;
      case T.PLAZA: c=COL.plaza[(tx+ty)%2]; break;
      case T.TEA: c=COL.tea[ty%4<1?0:1]; break;
      case T.FOREST: case T.TREE: c=COL.forest[Math.floor(h*3)]; break;
      default: c=COL.grass[Math.floor(h*3)];
    }
    ctx.fillStyle=c; ctx.fillRect(sx,sy,TS+1,TS+1);
    if(t===T.ROAD){ var z=zoneOf(tx,ty); if((tx%2===0)&&(ty===14||ty===42)){ ctx.fillStyle='#fff8'; ctx.fillRect(sx+8,sy+TS-3,TS-16,3); } }
    else if(t===T.GRASS && h>0.55 && h<0.62){ ctx.fillStyle='#7fcf78'; ctx.fillRect(sx+10,sy+14,3,8); ctx.fillRect(sx+15,sy+10,3,10); }
    else if(t===T.FLOWER){ ctx.fillStyle=['#ff8fb8','#fff','#ffd34d'][Math.floor(h*3)]; ctx.beginPath(); ctx.arc(sx+12,sy+14,4,0,6.3); ctx.arc(sx+27,sy+25,4,0,6.3); ctx.fill(); }
    else if(t===T.WATER && h>0.7){ ctx.fillStyle='#ffffff55'; ctx.fillRect(sx+8+Math.sin(time+tx)*4,sy+18,14,2); }
    else if(t===T.TEA){ ctx.fillStyle='#4aa043'; for(var k=0;k<4;k++) ctx.fillRect(sx+4+k*9,sy+16,5,5); }
    else if(t===T.PLAZA && h>0.8){ ctx.fillStyle='#d9c9a8'; ctx.fillRect(sx+4,sy+4,6,6); }
  }
}
function collectTall(x0,y0,x1,y1,list){
  for(var ty=y0;ty<=y1;ty++) for(var tx=x0;tx<=x1;tx++){
    var t=map[ty*MW+tx];
    if(t===T.TREE||t===T.BUILD||t===T.ROCK) list.push({ k:'tile', t:t, tx:tx, ty:ty, y:(ty+1)*TS });
  }
}
function drawTile(o,camx,camy){
  var sx=o.tx*TS-camx, sy=o.ty*TS-camy, h=hash(o.tx,o.ty), z=zoneOf(o.tx,o.ty);
  if(o.t===T.TREE){
    ctx.fillStyle='#00000022'; ctx.beginPath(); ctx.ellipse(sx+20,sy+36,15,6,0,0,6.3); ctx.fill();
    if(z===1){ // palm
      ctx.strokeStyle='#a8743f'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(sx+20,sy+38); ctx.quadraticCurveTo(sx+26,sy+18,sx+20,sy+4); ctx.stroke();
      ctx.fillStyle='#46b36a'; for(var i=0;i<5;i++){ var a=-1.2+i*0.6; ctx.beginPath(); ctx.ellipse(sx+20+Math.cos(a)*10,sy+4+Math.sin(a)*4,13,4,a,0,6.3); ctx.fill(); }
    } else if(z===2){ // pine
      ctx.fillStyle='#8a5a33'; ctx.fillRect(sx+17,sy+28,6,10);
      ctx.fillStyle='#3f9d62'; [[26,14],[18,17],[10,20]].forEach(function(r,i){ ctx.beginPath(); ctx.moveTo(sx+20,sy-6+i*9); ctx.lineTo(sx+20+r[0],sy+r[1]+i*9+6); ctx.lineTo(sx+20-r[0],sy+r[1]+i*9+6); ctx.fill(); });
    } else {
      ctx.fillStyle='#8a5a33'; ctx.fillRect(sx+16,sy+22,8,16);
      ctx.fillStyle=z===3?'#2f9d57':'#4fc26b'; ctx.beginPath(); ctx.arc(sx+20,sy+14,z===3?21:17,0,6.3); ctx.fill();
      ctx.fillStyle=z===3?'#3fb269':'#66d680'; ctx.beginPath(); ctx.arc(sx+14,sy+10,8,0,6.3); ctx.fill();
    }
  } else if(o.t===T.BUILD){
    var hgt=56+Math.floor(h*40), cols=['#ffb3c6','#a0d8ff','#ffe29a','#c7b8ff','#a8e6cf','#ffc9a3'];
    ctx.fillStyle='#00000022'; ctx.fillRect(sx+2,sy+TS-4,TS,6);
    ctx.fillStyle=cols[Math.floor(h*6)%6]; ctx.fillRect(sx,sy+TS-hgt,TS,hgt);
    ctx.fillStyle='#00000014'; ctx.fillRect(sx+TS-8,sy+TS-hgt,8,hgt);
    ctx.fillStyle='#fff'; for(var wy=sy+TS-hgt+8;wy<sy+TS-10;wy+=16){ ctx.fillRect(sx+7,wy,9,9); ctx.fillRect(sx+22,wy,9,9); }
    ctx.fillStyle='#ffffff99'; ctx.fillRect(sx-1,sy+TS-hgt-4,TS+2,5);
  } else if(o.t===T.ROCK){
    var big=(z===3||z===1);
    ctx.fillStyle='#00000022'; ctx.beginPath(); ctx.ellipse(sx+20,sy+37,19,6,0,0,6.3); ctx.fill();
    ctx.fillStyle=z===1?'#6fae6a':'#a9a2b8'; ctx.beginPath(); ctx.moveTo(sx,sy+38); ctx.lineTo(sx+8,sy+(big?-14:6)+h*8); ctx.lineTo(sx+20,sy+(big?-30:-2)); ctx.lineTo(sx+32,sy+(big?-12:8)); ctx.lineTo(sx+40,sy+38); ctx.closePath(); ctx.fill();
    if(z===3){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(sx+14,sy-18); ctx.lineTo(sx+20,sy-30); ctx.lineTo(sx+27,sy-16); ctx.lineTo(sx+20,sy-12); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle='#00000018'; ctx.beginPath(); ctx.moveTo(sx+20,sy+(big?-30:-2)); ctx.lineTo(sx+40,sy+38); ctx.lineTo(sx+22,sy+38); ctx.closePath(); ctx.fill();
  }
}
function drawTowers(camx,camy){
  [[27,5],[31,5]].forEach(function(p){
    var sx=p[0]*TS-camx, sy=p[1]*TS-camy;
    ctx.fillStyle='#00000022'; ctx.fillRect(sx+4,sy+3*TS-4,2*TS,8);
    var g=ctx.createLinearGradient(sx,0,sx+2*TS,0); g.addColorStop(0,'#e8eef7'); g.addColorStop(1,'#a9b9d0');
    ctx.fillStyle=g; ctx.fillRect(sx+6,sy-150,2*TS-12,3*TS+150);
    ctx.fillStyle='#d3dcec'; ctx.fillRect(sx+16,sy-180,2*TS-32,32);
    ctx.fillStyle='#e8eef7'; ctx.fillRect(sx+30,sy-210,2*TS-60,32);
    ctx.fillStyle='#cfd8e8'; ctx.fillRect(sx+36,sy-228,2*TS-72,20);
    ctx.fillStyle='#8fb4e6'; for(var y=sy-130;y<sy+3*TS-12;y+=18){ ctx.fillRect(sx+16,y,10,9); ctx.fillRect(sx+2*TS-26,y,10,9); ctx.fillRect(sx+2*TS/2-5,y,10,9); }
  });
  var bx=31*TS-camx, by=5*TS-camy; ctx.fillStyle='#c9d4e6'; ctx.fillRect(27*TS+2*TS-camx-6,by-60,TS*2+12,14);
}
function drawEntityShadow(x,y,w){ ctx.fillStyle='#00000030'; ctx.beginPath(); ctx.ellipse(x,y+4,w,w*0.38,0,0,6.3); ctx.fill(); }
function drawSprite(im,x,y,h,flip,fallbackCol){
  if(im && im.complete && im.naturalWidth){ var w=h*im.naturalWidth/im.naturalHeight; ctx.save(); ctx.translate(x,y); if(flip<0) ctx.scale(-1,1); ctx.drawImage(im,-w/2,-h,w,h); ctx.restore(); }
  else { ctx.fillStyle=fallbackCol||'#ff8fb8'; ctx.beginPath(); ctx.arc(x,y-h*0.4,h*0.3,0,6.3); ctx.fill(); }
}
function render(time){
  var camx=clamp(G.p.x-VW/2,0,Math.max(0,MW*TS-VW)), camy=clamp(G.p.y-VH/2,0,Math.max(0,MH*TS-VH));
  ctx.fillStyle='#6ec6ff'; ctx.fillRect(0,0,VW,VH);
  var x0=Math.max(0,Math.floor(camx/TS)-1), y0=Math.max(0,Math.floor(camy/TS)-1), x1=Math.min(MW-1,Math.ceil((camx+VW)/TS)+1), y1=Math.min(MH-1,Math.ceil((camy+VH)/TS)+4);
  drawGround(x0,y0,x1,y1,camx,camy,time);
  var list=[]; collectTall(x0,y0,x1,y1,list);
  G.mons.forEach(function(m){ if(!m.dead) list.push({ k:'mon', m:m, y:m.y+4 }); });
  G.pickups.forEach(function(k){ list.push({ k:'pick', p:k, y:k.y }); });
  list.push({ k:'player', y:G.p.y+4 });
  list.push({ k:'towers', y:6*TS+10 });
  list.sort(function(a,b){ return a.y-b.y; });
  list.forEach(function(o){
    if(o.k==='tile'){ if(o.t===T.BUILD && ((o.tx>=27&&o.tx<=28||o.tx>=31&&o.tx<=32)&&o.ty>=5&&o.ty<=7)) return; drawTile(o,camx,camy); }
    else if(o.k==='towers'){ drawTowers(camx,camy); }
    else if(o.k==='mon'){
      var m=o.m, d=MON[m.type], sx=m.x-camx, sy=m.y-camy, bob=Math.sin(time*5+m.hx)*2;
      drawEntityShadow(sx,sy,d.size*0.36);
      ctx.save(); if(m.hurt>0) ctx.globalAlpha=0.6;
      drawSprite(img('m',m.type),sx,sy+bob+4,d.size,1,'#ff6b6b'); ctx.restore();
      if(m.hp<m.max){ var bw=Math.max(34,d.size*0.8); ctx.fillStyle='#0003'; ctx.fillRect(sx-bw/2,sy-d.size-8,bw,6); ctx.fillStyle='#ff6b6b'; ctx.fillRect(sx-bw/2,sy-d.size-8,bw*m.hp/m.max,6); }
      ctx.fillStyle='#fff'; ctx.font='600 11px Fredoka,sans-serif'; ctx.textAlign='center'; ctx.fillText(d.name+' Lv.'+m.lvl, sx, sy-d.size-12);
    }
    else if(o.k==='pick'){ var sx2=o.p.x-camx, sy2=o.p.y-camy+Math.sin(time*4)*3; ctx.font='24px sans-serif'; ctx.textAlign='center'; ctx.fillText('\uD83C\uDF5B',sx2,sy2); }
    else if(o.k==='player'){
      var p=G.p, px=p.x-camx, py=p.y-camy, id=activeId(), bounce=p.moving?Math.abs(Math.sin(p.bob))*5:Math.sin(time*2)*1.2;
      drawEntityShadow(px,py,19);
      ctx.save(); if(p.inv>0 && Math.floor(time*20)%2) ctx.globalAlpha=0.5;
      drawSprite(img('c',id),px,py+6-bounce,92*(CHARS[id].scale||1),p.flip,ELEM[CHARS[id].el].color); ctx.restore();
    }
  });
  // effects
  G.fx.forEach(function(f){
    var k=f.t/f.life, sx=f.x-camx, sy=f.y-camy;
    if(f.k==='slash'){ ctx.strokeStyle='#fff'; ctx.lineWidth=7*(1-k); ctx.globalAlpha=1-k; var a=Math.atan2(f.fy,f.fx); ctx.beginPath(); ctx.arc(sx,sy,44,a-1.0,a+1.0); ctx.stroke(); ctx.globalAlpha=1; }
    else if(f.k==='ring'){ ctx.strokeStyle=f.col; ctx.lineWidth=10*(1-k); ctx.globalAlpha=1-k*0.6; ctx.beginPath(); ctx.arc(sx,sy,20+k*115,0,6.3); ctx.stroke(); ctx.fillStyle=f.col; ctx.globalAlpha=0.18*(1-k); ctx.fill(); ctx.globalAlpha=1; }
    else if(f.k==='pop'){ ctx.fillStyle='#ffe58a'; ctx.globalAlpha=1-k; for(var i=0;i<6;i++){ var an=i*1.05; ctx.beginPath(); ctx.arc(sx+Math.cos(an)*k*40,sy+Math.sin(an)*k*40-10,5*(1-k),0,6.3); ctx.fill(); } ctx.globalAlpha=1; }
    else if(f.k==='txt'){ ctx.globalAlpha=1-k*k; ctx.fillStyle=f.col; ctx.strokeStyle='#3b2a4a'; ctx.lineWidth=3; ctx.font='700 16px Fredoka,sans-serif'; ctx.textAlign='center'; var ty2=sy-k*34; ctx.strokeText(f.txt,sx,ty2); ctx.fillText(f.txt,sx,ty2); ctx.globalAlpha=1; }
  });
}

  Array.prototype.forEach.call($('starters').querySelectorAll('.starter'),function(el){ el.onclick=function(){ pickedStarter=el.dataset.id; Array.prototype.forEach.call($('starters').children,function(x){ x.classList.toggle('sel',x===el); }); checkName(); }; });
  checkName();
}
function checkName(){ $('btnStart').disabled=!(pickedStarter && $('nameInput').value.trim().length>=2); }
function startGame(){
  show('game'); cv=$('cv'); ctx=cv.getContext('2d'); resize(); newGame();
  if(!startGame.once){ startGame.once=true; bindInput(); window.addEventListener('resize',resize); }
  lastT=performance.now(); requestAnimationFrame(loop);
  toast('Welcome, '+S.name+'! Explore, befriend monsters, and study for wishes.');
  setTimeout(function(){ var h=$('helpHint'); if(h) h.style.opacity=0; },9000);
}
function bindInput(){
  var map={ ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', Space:'atk', KeyJ:'atk' };
  window.addEventListener('keydown',function(e){
    if(!G) return;
    if(e.code==='Escape'&&panelOpen){ closePanel(); return; }
    if(panelOpen||(e.target&&e.target.tagName==='INPUT')) return;
    if(map[e.code]){ keys[map[e.code]]=true; e.preventDefault(); }
    if(e.code==='KeyE'||e.code==='KeyK') doSkill();
    if(e.code==='KeyQ') openStudy(); if(e.code==='KeyB') openBag(); if(e.code==='KeyM') openMap();
    if(/^Digit[1-4]$/.test(e.code)) switchTo(+e.code.slice(5)-1);
  });
  window.addEventListener('keyup',function(e){ if(map[e.code]) keys[map[e.code]]=false; });
  $('bAtk').addEventListener('pointerdown',function(e){ e.preventDefault(); doAttack(); });
  $('bSkill').addEventListener('pointerdown',function(e){ e.preventDefault(); doSkill(); });
  $('miniMap').onclick=openMap; $('bStudy').onclick=openStudy; $('bWish').onclick=function(){ openWish(); }; $('bBag').onclick=openBag; $('bSet').onclick=openSettings;
  var st=$('stick'), kn=$('knob');
  function stickMove(e){ var r=st.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2), m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; } touch.dx=dx; touch.dy=dy; kn.style.left=(41+dx*38)+'px'; kn.style.top=(41+dy*38)+'px'; }
  st.addEventListener('pointerdown',function(e){ touch.id=e.pointerId; st.setPointerCapture(e.pointerId); stickMove(e); });
  st.addEventListener('pointermove',function(e){ if(touch.id===e.pointerId) stickMove(e); });
  var endStick=function(e){ if(touch.id===e.pointerId){ touch.id=null; touch.dx=0; touch.dy=0; kn.style.left='41px'; kn.style.top='41px'; } };
  st.addEventListener('pointerup',endStick); st.addEventListener('pointercancel',endStick);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) persist(); });
  window.addEventListener('pagehide',function(){ persist(); });
  setInterval(function(){ if(S&&dirty) persist(); },5000);
}

// The dashboard tells us when the tab is shown again (the iframe was hidden): re-measure the canvas.
window.addEventListener('message',function(e){
  if(e.origin!==location.origin) return;
  if(e.data && e.data.type==='iq-visible'){ resize(); if(G&&S) updateHUD(true); try{ window.focus(); }catch(err){} }
});

// ---- auth wiring ----
function initFirebase(retries){
  if(!window.firebaseSDK){
    if(retries<=0){ setStatus('loginStatus','Couldn\u2019t reach Firebase \u2014 you can still play as a guest.'); return; }
    setTimeout(function(){ initFirebase(retries-1); },250); return;
  }
  try{
    firebaseApp = (FROM==='mentoring') ? window.firebaseSDK.initializeApp(FIREBASE_CONFIG,'mentorMenteeApp') : window.firebaseSDK.initializeApp(FIREBASE_CONFIG);
    auth=window.firebaseSDK.getAuth(firebaseApp); db=window.firebaseSDK.getFirestore(firebaseApp);
  }catch(e){ setStatus('loginStatus','Firebase setup problem: '+e.message); return; }
  window.firebaseSDK.onAuthStateChanged(auth,function(user){
    if(!user||APP.mode==='demo') return;
    var pid=user.providerData&&user.providerData[0]&&user.providerData[0].providerId;
    APP.user=user;
    if(pid==='google.com'){ APP.mode='cloud'; APP.email=user.email; afterAuth(); }
    else { setStatus('loginStatus','You\u2019re signed in as staff \u2014 staff can play as a guest (saved on this device only).','info'); }
  });
}
$('btnGoogle').onclick=function(){
  if(!auth){ setStatus('loginStatus','Firebase isn\u2019t ready yet \u2014 try again in a moment, or play as a guest.'); return; }
  setStatus('loginStatus','Opening Google sign-in\u2026','info');
  window.firebaseSDK.signInWithPopup(auth,new window.firebaseSDK.GoogleAuthProvider()).catch(function(err){ setStatus('loginStatus','Sign-in failed: '+(err&&err.message?err.message:err)); });
};
$('btnGuest').onclick=function(){ APP.mode='demo'; APP.email=null; SUBJECT_Q=[]; afterAuth(); };
$('nameInput').addEventListener('input',checkName);
$('btnStart').onclick=function(){
  S=newSave($('nameInput').value.trim(),pickedStarter); markDirty(); persist(); startGame();
};
$('bStudy')&&0;
(function(){ var art=['ignis','lumi','pip'].map(function(id){ return '<img src="'+uri('c',id)+'" style="width:78px;height:108px;object-fit:contain" alt="">'; }).join(''); $('loginArt').innerHTML=art; })();
if(window.matchMedia && window.matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
initFirebase(40);

document.addEventListener('error',function(e){
  var t=e.target; if(t && t.tagName==='IMG' && /chars\//.test(t.getAttribute('src')||'')){
    t.style.visibility='hidden';
    if(!window.__picWarned){ window.__picWarned=1; toast('Some character pictures are missing \u2014 upload the "chars" folder next to game.html.'); }

},true);

  state:function(){ return S; }, game:function(){ return G; }, map:function(){ return map; }, reach:function(){ return reach; },
  setQs:function(q){ SUBJECT_Q=q; }, waypoints:function(){ return WPS; }, MAPCFG:MAPCFG, teleportTo:teleportTo, openMap:openMap, selectWaypoint:selectWaypoint, nearestWaypoint:nearestWaypoint, wpUnlocked:wpUnlocked, REVIVE:{ solo:REVIVE_SOLO_SEC, soloHp:REVIVE_SOLO_HP, wipe:WIPE_SEC, wipeHp:WIPE_HP }, RELEASE:RELEASE, featuredFor:featuredFor, isReleased:isReleased, FIVE_CHARS:FIVE_CHARS, FOUR_CHARS:FOUR_CHARS, STARTERS:function(){ return STARTERS; }, setWish:function(b,sub){ wishBanner=b; wishSub=sub||0; }, pickSemester:pickSemester, scope:function(){ return SCOPE; }, subjectQs:function(){ return SUBJECT_Q; }, loadQs:loadSubjectQuestions, setApp:function(m,e){ APP.mode=m; APP.email=e; }, nextQuestion:nextQuestion, answer:answer, keys:keys, doAttack:doAttack, doSkill:doSkill, hurt:hurtPlayer, killAll:function(){ G.mons.forEach(function(m){ if(!m.dead) killMon(m); }); },
  openStudy:openStudy, openWish:openWish, openBag:openBag, openSettings:openSettings, runWish:runWish, constants:{ MW:MW, MH:MH, TS:TS, SPAWN:SPAWN }
};
